<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="text-scale" content="scale">
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background:
          radial-gradient(
            circle at 18% 16%,
            rgba(76, 201, 240, 0.24),
            transparent 24%
          ),
          radial-gradient(
            circle at 78% 10%,
            rgba(255, 209, 102, 0.18),
            transparent 19%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(255, 90, 95, 0.22),
            transparent 34%
          ),
          linear-gradient(180deg, #040816 0%, #0b1827 52%, #170d10 100%);
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
