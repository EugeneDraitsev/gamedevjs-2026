<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="42%" cy="32%" r="68%">
      <stop offset="0" stop-color="#fff6bd"/>
      <stop offset=".44" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#a45f22"/>
    </radialGradient>

    <linearGradient id="cut" x1="28" x2="96" y1="24" y2="104">
      <stop offset="0" stop-color="#2a2418"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>

    <filter id="spark" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000814" flood-opacity=".5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffb84d" flood-opacity=".65"/>
    </filter>

    <rect id="ray" x="-5.5" y="-58" width="11" height="22" rx="3.25"/>
  </defs>

  <g filter="url(#spark)">
    <g fill="url(#glow)" stroke="#ffe7a3" stroke-linejoin="round" stroke-width="2" transform="translate(64 64)">
      <use href="#ray"/>
      <use href="#ray" transform="rotate(30)"/>
      <use href="#ray" transform="rotate(60)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)"/>
      <use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(300)"/>
      <use href="#ray" transform="rotate(330)"/>
    </g>

    <circle cx="64" cy="64" r="44" fill="url(#glow)" stroke="#fff0b5" stroke-width="3"/>
    <circle cx="64" cy="64" r="24" fill="url(#cut)" stroke="#ffd166" stroke-width="6"/>

    <path d="M43 48 A36 36 0 0 1 93 48" fill="none" stroke="#fff7ce" stroke-linecap="round" stroke-width="7" opacity=".55"/>
    <path d="M37 74 A36 36 0 0 0 91 89" fill="none" stroke="#6d3a16" stroke-linecap="round" stroke-width="5" opacity=".42"/>

    <circle cx="50" cy="38" r="4" fill="#fff8d4"/>
  </g>
</svg>